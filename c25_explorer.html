async function openFile(file, element) {
  document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
  element.classList.add('active');
  
  let content = '';
  try {
    if (file.handle) {
      const fileObj = await file.handle.getFile();
      content = await fileObj.text();
    } else if (file.entry) {
      content = await new Promise((resolve, reject) => {
        file.entry.file(f => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsText(f); }, reject);
      });
    }
  } catch(e) { content = `Error reading file: ${e.message}`; }
  
  document.getElementById('editorHeader').innerHTML = `<span>${file.path}</span><span style="color:#6e7681">${content.split('\n').length} lines</span>`;
  
  const lang = LANG_MAP[file.ext] || 'text';
  const escaped = content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = escaped.split('\n').map((line, i) => 
    `<span class="line-num">${i+1}</span>${highlightSyntax(line, lang)}`
  ).join('\n');
  
  document.getElementById('codeDisplay').innerHTML = `<pre><code>${lines}</code></pre>`;
}

function highlightSyntax(line, lang) {
  // Basic syntax highlighting
  if (lang === 'bash' || lang === 'python') {
    line = line.replace(/(#.*)/g, '<span style="color:#6a9955">$1</span>');
    line = line.replace(/\b(function|def|class|if|else|elif|for|while|return|import|from|export|const|let|var|async|await)\b/g, '<span style="color:#569cd6">$1</span>');
    line = line.replace(/(["'])(?:(?!\1).)*\1/g, '<span style="color:#ce9178">$&</span>');
  }
  if (lang === 'json') {
    line = line.replace(/(".*?")(\s*:)/g, '<span style="color:#9cdcfe">$1</span>$2');
    line = line.replace(/:\s*(".*?")/g, ': <span style="color:#ce9178">$1</span>');
  }
  if (lang === 'markdown') {
    line = line.replace(/^(#{1,6}\s.*)/g, '<span style="color:#569cd6;font-weight:bold">$1</span>');
    line = line.replace(/(\*\*.*?\*\*)/g, '<span style="color:#ce9178;font-weight:bold">$1</span>');
  }
  return line;
}
