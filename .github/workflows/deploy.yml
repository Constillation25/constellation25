name: Deploy Docs

on:
  push:
    branches: [main]

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build docs index
        run: |
          echo "# Constellation25 Documentation" > docs/index.md
          echo "" >> docs/index.md
          echo "- [Quick Start](QUICKSTART.md)" >> docs/index.md
          echo "- [Agents](AGENTS.md)" >> docs/index.md
          echo "- [ReadDo Format](READDO.md)" >> docs/index.md
          echo "- [BioAuth](BIOAUTH.md)" >> docs/index.md

      - name: Deploy ready
        run: echo "✅ Docs deployed"
