name: C25 Sovereign Build & Test
on: [push, pull_request]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Scaffold C25 Directories
        run: |
          mkdir -p agents core/readdo gateway/retail gateway/online db/migrations logs/forensic
          for i in {1..25}; do touch "agents/agent-${i}.js"; done
          
      - name: Validate Structure
        run: |
          test -d agents && echo "✅ Agents dir exists"
          test -f package-lock.json && echo "✅ Lock file present"
