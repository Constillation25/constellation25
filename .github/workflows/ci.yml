name: Constellation25 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Verify scripts are executable
        run: |
          chmod +x *.sh agents/*.sh scripts/*.sh 2>/dev/null || true
          echo "✓ Scripts executable"

      - name: Syntax check bash scripts
        run: |
          for f in *.sh agents/*.sh scripts/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "✓ $f" || echo "✗ $f"
          done

      - name: Verify Python syntax
        run: |
          for f in *.py agents/*.py; do
            [ -f "$f" ] && python3 -m py_compile "$f" && echo "✓ $f" || echo "✗ $f"
          done

      - name: Check documentation
        run: |
          [ -f "README.md" ] && echo "✓ README.md" || echo "✗ README.md missing"
          [ -f "docs/QUICKSTART.md" ] && echo "✓ QUICKSTART.md" || echo "✗ QUICKSTART.md missing"
          [ -f "install.sh" ] && echo "✓ install.sh" || echo "✗ install.sh missing"

      - name: Deployment ready
        run: echo "✅ Constellation25 CI passed"

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Get version
        id: version
        run: echo "version=$(cat package.json | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])")" >> $GITHUB_OUTPUT

      - name: Release info
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Constellation25 is ready for global distribution"
